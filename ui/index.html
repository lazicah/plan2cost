<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan2Cost Console</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#e2dfd7;--accent:#1f6f5c;--ok:#1f7a4d;--warn:#a86a00;--bad:#b3362c;--info:#2f5fa8;--chip:#efece4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151512;--card:#1e1d1a;--ink:#ecebe6;--mute:#9a968c;--line:#33312c;--accent:#5fc1a6;--ok:#6cc58f;--warn:#e0a54a;--bad:#e5786d;--info:#7fa6e8;--chip:#2a2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0;letter-spacing:.2px}h1 span{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:0 0 10px}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}button:disabled{opacity:.5}
.spacer{flex:1}
main{padding:16px;max-width:1280px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){.cols{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--chip)}
.running{color:var(--info)}.needs_input{color:var(--warn)}.done{color:var(--ok)}.paused,.failed{color:var(--bad)}
.proven{color:var(--ok)}.assumed{color:var(--warn)}.escalated{color:var(--bad)}.open{color:var(--mute)}
.turn{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.turn.pause{border-color:var(--warn)}.turn.err{border-color:var(--bad)}.turn.ok{border-color:var(--accent)}
.tool{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600}
.mute{color:var(--mute)}.small{font-size:13px}
pre{margin:6px 0 0;padding:8px;background:var(--chip);border-radius:6px;overflow:auto;max-height:150px;font-size:12px;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.q{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.q textarea{width:100%;min-height:64px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--mute);padding:20px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Plan2<span>Cost</span> <span class="mute" style="font-weight:400">console</span></h1>
  <select id="runs" aria-label="Run"></select>
  <div class="spacer"></div>
  <input id="pdf" size="38" placeholder="Path to a drawing set (.pdf)" aria-label="PDF path">
  <button id="start">Start run</button>
</header>
<main id="main"><div class="empty">No run yet. Enter the path of a drawing set above and start one.</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n == null ? '' : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
let current = null, lastKey = '';

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}

function turnClass(t) {
  const r = t.result || {};
  if (r.error || r.refused) return 'err';
  if (r.paused) return 'pause';
  return 'ok';
}
function brief(t) {
  const r = t.result || {};
  if (r.error) return '⚠ ' + r.error;
  if (r.refused) return '⚠ Refused: ' + r.refused.join(' ');
  if (r.paused) return 'Paused for you: ' + r.question;
  if (r.answer) return 'You answered: ' + r.answer;
  if (r.recorded) return `Recorded ${r.recorded.name} = ${r.recorded.value} ${r.recorded.unit || ''} (${r.recorded.verified || r.recorded.source})`;
  if (r.total != null) return `BoQ computed: ${r.lines} lines, total ${money(r.total)} ${r.currency || ''}` + (r.unpriced?.length ? `, unpriced: ${r.unpriced.join(', ')}` : '');
  if (r.checklist) return `Checklist set: ${r.checklist.length} items`;
  if (r.roles) return `${r.pages} pages indexed: ` + Object.entries(r.roles).map(([k, v]) => `${k} ${v.length}`).join(', ');
  return '';
}

function render(run) {
  const done = run.checklist.filter(c => ['proven', 'assumed'].includes(c.status)).length;
  const q = run.pending ? `<section class="card q"><h2>The agent needs you</h2>
      <div><b>${esc(run.pending.item)}</b> ${esc(run.pending.question)}</div>
      <textarea id="ans" placeholder="Your answer"></textarea>
      <button id="answer">Answer and continue</button></section>` : '';
  const turns = run.turns.length ? run.turns.map((t, i) => `<div class="turn ${turnClass(t)}">
      <div><span class="tool">${i + 1}. ${esc(t.tool)}</span> <span class="mute small">${esc(t.reason)}</span></div>
      <div class="small">${esc(brief(t))}</div></div>`).join('') : '<div class="empty">Waiting for the first turn…</div>';
  const checklist = run.checklist.length ? run.checklist.map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.question)}</td>
      <td><span class="pill ${c.status}">${esc(c.status)}</span></td></tr>`).join('') : '<tr><td class="mute">Not set yet</td></tr>';
  const facts = run.facts.map(f => `<tr><td>${esc(f.item)}</td><td>${esc(f.name)}</td><td class="n">${esc(f.value)} ${esc(f.unit)}</td>
      <td><span class="pill ${f.source === 'assumed' ? 'assumed' : f.source === 'computed' ? 'open' : 'proven'}">${esc(f.source)}</span></td>
      <td class="small mute">${f.page ? 'p.' + esc(f.page) + ' ' : ''}${esc(f.verified || f.basis || '')}</td></tr>`).join('');
  const boq = run.boq ? `<section class="card"><h2>Bill of quantities</h2><table>
      <tr><th>Description</th><th>Unit</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>
      ${run.boq.items.map(i => `<tr><td>${esc(i.description)}</td><td>${esc(i.unit)}</td><td class="n">${money(i.qty)}</td>
        <td class="n">${i.rate ? money(i.rate) : '<span class="assumed">no rate</span>'}</td><td class="n">${i.amount ? money(i.amount) : ''}</td></tr>`).join('')}
      <tr><td colspan="4"><b>Total (priced lines)</b></td><td class="n"><b>${money(run.boq.total)} ${esc(run.boq.currency)}</b></td></tr></table>
      ${run.boq.unpriced?.length ? `<p class="small assumed">Unpriced, add a rate to include: ${run.boq.unpriced.map(esc).join(', ')}</p>` : ''}
      ${run.assumptions.length ? `<p class="small mute">Assumptions: ${run.assumptions.map(a => esc(a.name) + ' = ' + esc(a.value) + ' (' + esc(a.basis) + ')').join('; ')}</p>` : ''}</section>` : '';
  $('#main').innerHTML = `<section class="card row"><span class="pill ${run.status}">${esc(run.status.replace('_', ' '))}</span>
      <span>Turn ${run.turn}</span><span class="mute small">${esc(run.pdf.split('/').pop())}</span><span class="spacer"></span>
      <span class="small">${done}/${run.checklist.length} checklist items settled</span></section>${q}
    <div class="cols"><section class="card"><h2>What the agent did</h2>${turns}</section>
      <div style="display:grid;gap:16px;align-content:start"><section class="card"><h2>Checklist</h2><table>${checklist}</table></section>
      <section class="card"><h2>Facts and where they came from</h2><table><tr><th>Item</th><th>Name</th><th class="n">Value</th><th>Source</th><th>Check</th></tr>${facts || '<tr><td class="mute">None yet</td></tr>'}</table></section></div></div>${boq}`;
  const btn = $('#answer');
  if (btn) btn.onclick = async () => { btn.disabled = true; await api(`/api/runs/${run.id}/answer`, {answer: $('#ans').value}); };
}

async function tick() {
  const runs = await api('/api/runs');
  const sel = $('#runs');
  const prev = current;
  sel.innerHTML = runs.map(r => `<option value="${r.id}">${r.id} · ${r.status} · ${r.turn} turns</option>`).join('');
  if (!current && runs.length) current = runs[0].id;
  if (current) sel.value = current;
  if (!current) return;
  const run = await api('/api/runs/' + current);
  const key = JSON.stringify([run.status, run.turn, run.pending, run.facts.length]) + document.activeElement?.id;
  if (key !== lastKey || prev !== current) { if (document.activeElement?.id !== 'ans') render(run); lastKey = key; }
}
$('#runs').onchange = e => { current = e.target.value; lastKey = ''; tick(); };
$('#start').onclick = async () => {
  const r = await api('/api/start', {pdf: $('#pdf').value});
  if (r.error) return alert(r.error);
  current = null; lastKey = '';
  setTimeout(tick, 1500);
};
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
