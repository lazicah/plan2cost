<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan2Cost Console</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#e2dfd7;--accent:#1f6f5c;--ok:#1f7a4d;--warn:#a86a00;--bad:#b3362c;--info:#2f5fa8;--chip:#efece4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151512;--card:#1e1d1a;--ink:#ecebe6;--mute:#9a968c;--line:#33312c;--accent:#5fc1a6;--ok:#6cc58f;--warn:#e0a54a;--bad:#e5786d;--info:#7fa6e8;--chip:#2a2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0;letter-spacing:.2px}h1 span{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:0 0 10px}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}button:disabled{opacity:.5}
.spacer{flex:1}
main>*,.cols>*{min-width:0}
main{padding:16px;max-width:1280px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){.cols{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--chip)}
.running{color:var(--info)}.needs_input{color:var(--warn)}.done{color:var(--ok)}.paused,.failed{color:var(--bad)}
.proven{color:var(--ok)}.assumed{color:var(--warn)}.escalated{color:var(--bad)}.open{color:var(--mute)}
.turn{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.turn.pause{border-color:var(--warn)}.turn.err{border-color:var(--bad)}.turn.ok{border-color:var(--accent)}
.tool{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600}
.mute{color:var(--mute)}.small{font-size:13px}
pre{margin:6px 0 0;padding:8px;background:var(--chip);border-radius:6px;overflow:auto;max-height:150px;font-size:12px;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.q{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.q textarea{width:100%;min-height:64px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.pick input{display:none}.pick.set{border-style:solid;border-color:var(--accent);color:var(--accent)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumb{flex:0 0 auto;width:120px;font-size:11px;color:var(--mute);text-align:center}
.thumb img{width:120px;height:86px;object-fit:cover;border:2px solid var(--line);border-radius:6px;background:#fff;display:block}
.thumb.active img{border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 25%,transparent)}
.live{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line)}
.live img{width:100%;display:block}
.live::after{content:"";position:absolute;left:0;right:0;height:14%;top:-14%;background:linear-gradient(transparent,color-mix(in srgb,var(--info) 35%,transparent),transparent);animation:scan 2.2s linear infinite}
@keyframes scan{to{top:100%}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile.on{border-color:var(--ok)}.tile.wait{opacity:.55}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--mute)}
.stages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stage{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--mute)}
.stage.done{color:var(--ok);border-color:var(--ok)}.stage.active{color:var(--info);border-color:var(--info);font-weight:600}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--info);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;margin:2px;font-size:12px}
a.dl{display:inline-block;margin-right:12px;color:var(--accent)}
.empty{color:var(--mute);padding:20px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Plan2<span>Cost</span> <span class="mute" style="font-weight:400">console</span></h1>
  <select id="runs" aria-label="Run"></select>
  <div class="spacer"></div>
  <label class="pick"><input type="file" id="pdf" accept=".pdf"><span id="pdfname">Choose the drawings (PDF)</span></label>
  <label class="pick"><input type="file" id="structural" accept=".pdf"><span id="structuralname">Structural drawings (optional)</span></label>
  <label class="pick"><input type="file" id="quote" accept=".pdf,.png,.jpg,.jpeg,.xlsx"><span id="quotename">Contractor quote (optional)</span></label>
  <button id="start">Start run</button>
</header>
<main id="main"><div class="empty">No run yet. Choose a drawing set above and press Start run.</div></main>
<details id="logbox" style="max-width:1280px;margin:0 auto;padding:0 16px 24px"><summary class="small mute">Process log (errors from background runs appear here)</summary><pre id="log"></pre></details>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n == null ? '' : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
let current = null, lastKey = '';

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}

function turnClass(t) {
  const r = t.result || {};
  if (r.error || r.refused) return 'err';
  if (r.paused) return 'pause';
  return 'ok';
}
function brief(t) {
  const r = t.result || {};
  if (r.error) return '⚠ ' + r.error;
  if (r.refused) return '⚠ Refused: ' + r.refused.join(' ');
  if (r.paused) return 'Paused for you: ' + r.question;
  if (r.answer) return 'You answered: ' + r.answer;
  if (Array.isArray(r.recorded)) return `Read from the structural drawing (p.${r.page}): ${r.recorded.join(', ') || 'nothing'}`;
  if (r.recorded) return `Recorded ${r.recorded.name} = ${r.recorded.value} ${r.recorded.unit || ''} (${r.recorded.verified || r.recorded.source})`;
  if (r.total != null) return `BoQ computed: ${r.lines} lines, total ${money(r.total)} ${r.currency || ''}` + (r.unpriced?.length ? `, unpriced: ${r.unpriced.join(', ')}` : '');
  if (r.filed) return `BoQ filed. Bills: ${(r.bills || []).join(', ')}`;
  if (r.counts && r.flags) return `Quote audited: ${r.flags.length} questions for the contractor`;
  if (r.checklist) return `Checklist set: ${r.checklist.length} items`;
  if (r.roles) return `${r.pages} pages indexed: ` + Object.entries(r.roles).map(([k, v]) => `${k} ${v.length}`).join(', ');
  return '';
}

function render(run) {
  const done = run.checklist.filter(c => ['proven', 'assumed'].includes(c.status)).length;
  const stopped = run.status === 'paused' ? `<section class="card q"><h2>The run stopped</h2><div class="small">${esc(run.error || 'It ran out of turns.')} Everything so far is saved.</div>
      <button id="resume">Continue the run</button></section>` : '';
  const q = run.pending ? `<section class="card q"><h2>The agent needs you</h2>
      <div><b>${esc(run.pending.item)}</b> ${esc(run.pending.question)}</div>
      <textarea id="ans" placeholder="Your answer"></textarea>
      <button id="answer">Answer and continue</button></section>` : '';
  const turns = run.turns.length ? run.turns.map((t, i) => `<div class="turn ${turnClass(t)}">
      <div><span class="tool">${i + 1}. ${esc(t.tool)}</span> <span class="mute small">${esc(t.reason)}</span></div>
      <div class="small">${esc(brief(t))}</div></div>`).join('') : '<div class="empty">Waiting for the first turn…</div>';
  const checklist = run.checklist.length ? run.checklist.map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.question)}</td>
      <td><span class="pill ${c.status}">${esc(c.status)}</span></td></tr>`).join('') : '<tr><td class="mute">Not set yet</td></tr>';
  const facts = run.facts.map(f => `<tr><td>${esc(f.item)}</td><td>${esc(f.name)}</td><td class="n">${esc(f.value)} ${esc(f.unit)}</td>
      <td><span class="pill ${f.source === 'assumed' ? 'assumed' : f.source === 'computed' ? 'open' : 'proven'}">${esc(f.source)}</span>
      <span class="pill ${f.confidence === 'high' ? 'proven' : f.confidence === 'medium' ? 'assumed' : 'escalated'}">${esc(f.confidence || '')}</span></td>
      <td class="small mute">${f.page ? 'p.' + esc(f.page) + ' ' : ''}${esc(f.verified || f.basis || '')}</td></tr>`).join('');
  const boq = run.boq ? `<section class="card"><h2>Bill of quantities</h2><table>
      <tr><th>BESMM4</th><th>Description</th><th>Unit</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>
      ${run.boq.items.map(i => `<tr><td class="small mute">${esc(i.besmm || "own line")}</td><td>${esc(i.description)}</td><td>${esc(i.unit)}</td><td class="n">${money(i.qty)}</td>
        <td class="n">${i.rate ? money(i.rate) : '<span class="assumed">no rate</span>'}</td><td class="n">${i.amount ? money(i.amount) : ''}</td></tr>`).join('')}
      <tr><td colspan="5"><b>Total (priced lines)</b></td><td class="n"><b>${money(run.boq.total)} ${esc(run.boq.currency)}</b></td></tr></table>
      ${run.boq.coverage ? `<p class="small"><b>Coverage.</b> ${esc(run.boq.coverage.statement)}</p><table class="small"><tr><th>Trade</th><th class="n">Covered</th><th class="n">Partly</th><th class="n">Not included</th></tr>
        ${Object.entries(run.boq.coverage.trades).map(([t, v]) => `<tr><td>${esc(t.replace(/_/g, ' '))}</td><td class="n">${v.covered}</td><td class="n">${v.partial}</td><td class="n ${v.not_built ? 'assumed' : ''}">${v.not_built}</td></tr>`).join('')}</table>` : ''}
      ${run.boq.unpriced?.length ? `<p class="small assumed">Unpriced, add a rate to include: ${run.boq.unpriced.map(esc).join(', ')}</p>` : ''}
      ${run.assumptions.length ? `<p class="small mute">Assumptions: ${run.assumptions.map(a => esc(a.name) + ' = ' + esc(a.value) + ' (' + esc(a.basis) + ')').join('; ')}</p>` : ''}</section>` : '';
  const audit = run.audit ? `<section class="card"><h2>Contractor quote audit</h2>
      <div class="small">${run.audit.lines} quote lines, ${run.audit.matched} matched to our BoQ. On the matched lines the quote totals ${money(run.audit.quote_total_on_matched_lines)} against ${money(run.audit.our_total_on_matched_lines)} at your rates; priced work the quote leaves out is about ${money(run.audit.our_priced_work_not_in_quote)}.</div>
      <table class="small"><tr><th>Line</th><th>What we found</th><th>What to ask</th></tr>${run.audit.flags.map(f => `<tr><td>${esc(f.line)}</td>
        <td class="${f.severity === 'error' ? 'escalated' : f.severity === 'warn' ? 'assumed' : ''}">${esc(f.message)}</td><td class="mute">${esc(f.ask)}</td></tr>`).join('')}</table>
      ${run.audit.unverified_readings?.length ? `<p class="small mute">Not printed on the quote, so not used: ${run.audit.unverified_readings.map(esc).join('; ')}</p>` : ''}</section>` : '';
  const models = Object.values(run.models || {}).map(m => `<section class="card"><h2>Walls found: ${esc(m.floor)} floor, page ${esc(m.page)}</h2>
      <div class="small">${m.walls} walls, ${money(m.total_m)} m (external ${money(m.external_m)}, internal ${money(m.internal_m)}) by the ${esc(m.route)} route, ${esc(m.confidence)} confidence.</div>
      ${m.issues.length ? `<ul class="small">${m.issues.map(i => `<li class="${i.severity === 'error' ? 'escalated' : 'assumed'}">${esc(i.message)}</li>`).join('')}</ul>` : '<div class="small proven">All checks passed.</div>'}
      <a href="/api/runs/${run.id}/${esc(m.markup)}?v=${run.turn}" target="_blank"><img src="/api/runs/${run.id}/${esc(m.markup)}?v=${run.turn}" alt="annotated plan" style="width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px"></a></section>`).join('');
  const nowPage = run.now && run.now.args && run.now.args.page ? Number(run.now.args.page) : null;
  const thumbFor = n => run.thumbs.includes('p' + String(n).padStart(2, '0') + '.jpg') ? `/api/runs/${run.id}/pages/p${String(n).padStart(2, '0')}.jpg` : null;
  const roleOf = n => (run.pages.find(p => p.page === n) || {}).role;
  const gallery = run.thumbs.length ? `<section class="card"><h2>The drawings</h2><div class="thumbs">${run.thumbs.map(f => { const n = Number(f.slice(1, 3));
      return `<a class="thumb ${n === nowPage ? 'active' : ''}" href="/api/runs/${run.id}/pages/${f}" target="_blank"><img src="/api/runs/${run.id}/pages/${f}" alt="page ${n}">${n} ${esc(String(roleOf(n) || '').replace(/_/g, ' '))}</a>`; }).join('')}</div></section>` : '';
  const pv = run.preview;
  const reading = pv ? `<section class="card"><h2>Walls measured: ${esc(pv.floor)} floor, page ${esc(pv.page)}</h2>
      <img src="/api/runs/${run.id}/${esc(pv.markup)}?v=${pv.walls}" alt="the walls measured" style="width:100%;border:1px solid var(--line);border-radius:8px">
      <div class="small" style="margin-top:6px"><b>${pv.walls} walls, ${money(pv.total_m)} m</b> (external ${money(pv.external_m)}, internal ${money(pv.internal_m)}) by the ${esc(pv.route)} route. Red is external, blue internal; numbers are wall ids.
        <span class="mute">The model is now reviewing this plan for mistakes.</span></div></section>`
    : run.now && ['read_wall_girth', 'locate_openings'].includes(run.now.tool) && nowPage && thumbFor(nowPage) ? `<section class="card"><h2>Reading page ${nowPage}: ${esc(run.now.args.floor || '')} floor</h2>
      <div class="live"><img src="${thumbFor(nowPage)}" alt="the plan being read"></div>
      <div class="small mute" style="margin-top:6px">${run.now.tool === 'read_wall_girth' ? 'Finding the wall lines and fixing the scale from the printed dimensions. The measured walls appear here as soon as they are ready.' : 'Looking at each gap in the walls to see if it is a door or a window.'}</div></section>` : '';
  const b = run.built, wf = Object.entries(b.walls);
  const tile = (on, big, label) => `<div class="tile ${on ? 'on' : 'wait'}"><b>${on ? big : '…'}</b><span>${label}</span></div>`;
  const tiles = `<section class="card"><h2>Built so far</h2><div class="tiles">
      ${tile(wf.length, wf.map(([f, m]) => money(m.total_m) + ' m').join(' + '), wf.length ? 'wall girth, ' + wf.map(([f]) => f).join(' + ') + ' floor' : 'walls')}
      ${tile(Object.keys(b.openings_found).length, Object.values(b.openings_found).reduce((a, c) => a + c, 0) + ' of ' + b.openings_scheduled, 'doors and windows tied to walls')}
      ${tile(b.pads || b.strip, b.strip ? money(b.strip.net_m) + ' m' : b.pads + ' bases', 'foundation: strip girth, column bases')}
      ${tile(b.foundation_lines, b.foundation_lines + ' lines', 'foundation quantities')}
      ${tile(b.boq, b.boq ? b.boq.lines + ' lines' : '', b.boq ? money(b.boq.total) + ' ' + b.boq.currency : 'priced bill')}</div></section>`;
  const progress = `<section class="card"><div class="stages">${run.stages.map(s => `<span class="stage ${s.done ? 'done' : s.active ? 'active' : ''}">${s.done ? '✓ ' : s.active && run.status === 'running' ? '<span class="spin"></span>' : ''}${esc(s.label)}${s.count > 1 ? ' ×' + s.count : ''}</span>`).join('')}</div>
      ${run.now ? `<div class="small" style="margin-top:10px"><span class="spin"></span><b>Working on:</b> <span class="tool">${esc(run.now.tool)}</span> ${esc(Object.values(run.now.args).join(', '))} <span class="mute">${esc(run.now.reason)}</span></div>` : ''}
      ${run.pages.length ? `<div class="small mute" style="margin-top:8px">Pages: ${run.pages.map(p => `<span class="chip">${esc(p.page)} ${esc(String(p.role).replace(/_/g, ' '))}</span>`).join('')}</div>` : ''}</section>`;
  const downloads = run.files.length ? `<section class="card"><h2>Files</h2>${run.files.map(f => `<a class="dl" href="/api/runs/${run.id}/files/${esc(f)}">${esc(f.replace(/_/g, ' ').replace('.xlsx', ' (Excel)').replace('.pdf', ' (PDF)').replace('.json', ' (data)'))}</a>`).join('')}
      <div class="small mute" style="margin-top:6px">The priced bill is for a client. The unpriced bill is for tender: contractors fill in the rates and return it.</div></section>` : '';
  const bidsBox = run.status === 'done' ? `<section class="card"><h2>Bids returned on the unpriced bill</h2>
      <label class="pick"><input type="file" id="bids" accept=".xlsx,.pdf,.png,.jpg,.jpeg" multiple><span id="bidsname">Choose the returned bills (Excel, PDF or image)</span></label> <button id="auditbids">Audit the bids</button>
      <span class="small mute" id="bidmsg"></span></section>` : '';
  const tender = run.tender ? (() => { const names = Object.keys(run.tender.bids); return `<section class="card"><h2>Bids compared</h2>
      <table class="small"><tr><th>Bidder</th><th class="n">Total at our quantities</th><th class="n">Unpriced items</th><th>Questions</th></tr>${names.map(n => { const b = run.tender.bids[n];
        return `<tr><td>${esc(n)}</td><td class="n">${money(b.total_at_issued_quantities)}</td><td class="n ${b.unpriced_items.length ? 'assumed' : ''}">${b.unpriced_items.length}</td>
        <td>${Object.entries(b.counts).map(([k, v]) => esc(k.replace(/_/g, ' ')) + ' ' + v).join(', ') || '<span class="proven">none</span>'}</td></tr>`; }).join('')}</table>
      <p class="small mute">${esc(run.tender.note)}</p>
      ${names.map(n => `<details><summary class="small"><b>${esc(n)}</b>: ${run.tender.bids[n].flags.length} flags</summary><table class="small">${run.tender.bids[n].flags.map(f => `<tr><td>${esc(f.line)}</td>
        <td class="${f.severity === 'error' ? 'escalated' : f.severity === 'warn' ? 'assumed' : ''}">${esc(f.message)}</td><td class="mute">${esc(f.ask)}</td></tr>`).join('')}</table></details>`).join('')}
      <details><summary class="small"><b>Rates side by side</b></summary><table class="small"><tr><th>No</th><th>Item</th><th class="n">Qty</th>${names.map(n => `<th class="n">${esc(n)}</th>`).join('')}</tr>
        ${run.tender.comparison.map(r => `<tr><td>${esc(r.no)}</td><td>${esc(r.description.slice(0, 60))}</td><td class="n">${money(r.qty)} ${esc(r.unit)}</td>${names.map(n => `<td class="n">${money(r.rates[n])}</td>`).join('')}</tr>`).join('')}</table></details></section>`; })() : '';
  $('#main').innerHTML = `<section class="card row"><span class="pill ${run.status}">${esc(run.status.replace('_', ' '))}</span>
      <span>Turn ${run.turn}</span><span class="mute small">${esc(run.pdf.split('/').pop())}</span><span class="spacer"></span>
      <span class="small">${done}/${run.checklist.length} checklist items settled</span></section>${progress}${stopped}${reading}${tiles}${q}${gallery}
    <div class="cols"><section class="card"><h2>What the agent did</h2>${turns}</section>
      <div style="display:grid;gap:16px;align-content:start"><section class="card"><h2>Checklist</h2><table>${checklist}</table></section>
      <section class="card"><h2>Facts and where they came from</h2><table><tr><th>Item</th><th>Name</th><th class="n">Value</th><th>Source, confidence</th><th>Check</th></tr>${facts || '<tr><td class="mute">None yet</td></tr>'}</table></section></div></div>${models}${boq}${downloads}${audit}${bidsBox}${tender}`;
  const ab = $('#auditbids');
  const rs = $('#resume');
  if (rs) rs.onclick = async () => { rs.disabled = true; await api(`/api/runs/${run.id}/resume`, {}); };
  const bi = $('#bids');
  if (bi) bi.onchange = () => { $('#bidsname').textContent = [...bi.files].map(f => f.name).join(', ') || 'Choose the returned bills'; };
  if (ab) ab.onclick = async () => {
    if (!bi.files.length) return $('#bidmsg').textContent = ' Choose the returned bills first.';
    $('#bidmsg').textContent = ' Uploading…';
    const paths = []; for (const f of bi.files) paths.push((await upload(f)).path);
    const r = await api(`/api/runs/${run.id}/bids`, {bids: paths}); $('#bidmsg').textContent = r.error || ' Reading the bids…'; };
  const btn = $('#answer');
  if (btn) btn.onclick = async () => { btn.disabled = true; await api(`/api/runs/${run.id}/answer`, {answer: $('#ans').value}); };
}

async function tick() {
  const runs = await api('/api/runs');
  const sel = $('#runs');
  const prev = current;
  sel.innerHTML = runs.map(r => `<option value="${r.id}">${r.id} · ${r.status} · ${r.turn} turns</option>`).join('');
  if (!current && runs.length) current = runs[0].id;
  if (current) sel.value = current;
  if (!current) return;
  const run = await api('/api/runs/' + current);
  const key = JSON.stringify([run.status, run.turn, run.pending, run.facts.length, run.now, run.files, !!run.tender, run.thumbs.length, run.built, run.preview, run.error]) + document.activeElement?.id;
  if (key !== lastKey || prev !== current) { if (document.activeElement?.id !== 'ans') render(run); lastKey = key; }
}
$('#runs').onchange = e => { current = e.target.value; lastKey = ''; tick(); };
async function upload(file) {
  const r = await fetch('/api/upload?name=' + encodeURIComponent(file.name), {method: 'POST', body: file});
  return r.json();
}
for (const id of ['pdf', 'structural', 'quote']) $('#' + id).onchange = e => {
  const f = e.target.files[0]; $('#' + id + 'name').textContent = f ? f.name : $('#' + id + 'name').dataset.label;
  e.target.parentElement.classList.toggle('set', !!f);
};
for (const id of ['pdf', 'structural', 'quote']) $('#' + id + 'name').dataset.label = $('#' + id + 'name').textContent;
$('#start').onclick = async () => {
  if (!$('#pdf').files.length) return alert('Choose the drawings first.');
  $('#start').disabled = true; $('#start').textContent = 'Uploading…';
  try {
    const body = {};
    for (const id of ['pdf', 'structural', 'quote']) if ($('#' + id).files.length) { const r = await upload($('#' + id).files[0]); if (r.error) return alert(r.error); body[id] = r.path; }
    const r = await api('/api/start', body);
    if (r.error) return alert(r.error);
    current = null; lastKey = ''; setTimeout(tick, 1500);
  } finally { $('#start').disabled = false; $('#start').textContent = 'Start run'; }
};
async function showLog() { if ($('#logbox').open) $('#log').textContent = (await api('/api/log')).tail || '(empty)'; }
tick(); setInterval(tick, 2000); setInterval(showLog, 3000);
</script>
</body>
</html>
